# Preset: Engineering Manager
# Optimized for engineering leadership roles

version: 1

profile:
  title: "Engineering Manager"
  skills: []                           # Fill in your tech stack
  seniority: "lead"
  location: ""                         # Fill in your region
  remote_only: true
  min_salary_usd_month: null          # Optional hard floor, USD per month (e.g. 6000). Jobs without a published salary are never dropped for this.
  location_allow: []                   # Location terms you can work from, e.g. ["latam", "latin america", "brazil", "worldwide"]
  location_block: []                   # Location terms to reject, e.g. ["united states", "europe", "india"]
  resume_path: ""

language: "en"

keywords:
  en:
    - "Engineering Manager"
    - "Technical Lead"
    - "Head of Engineering"
    - "VP Engineering"
    - "Engineering Director"
    - "Development Manager"
    - "Software Engineering Manager"
    - "Director of Engineering"
    - "Principal Engineer"
  es:
    - "Gerente de Ingeniería"
    - "Líder Técnico"
    - "Director de Ingeniería"
    - "Jefe de Tecnología"
    - "Gerente de Desarrollo"

  exclude: []                          # Title terms to drop even if a keyword matches, e.g. ["frontend", "mobile", "qa"]

sources:
  greenhouse: true
  lever: true
  ashby: true
  remoteok: true
  getonboard: true
  himalayas: true
  workingnomads: true
  weworkremotely: true
  linkedin:
    enabled: false

watchlist: []

# --- Scoring ---
# The scorer judges each opportunity on these criteria and returns a verdict:
#   APPLY    - meets the hard requirements (location, compensation, role) with no blocker
#   EVALUATE - promising but something is unknown (e.g. salary not published)
#   SKIP     - a hard requirement fails
scoring:
  criteria:
    - "Domain fit"
    - "Tech stack fit"
    - "Leadership fit"
    - "Company stage fit"

output:
  file: "opportunities.md"
