# Preset: Software Developer
# Optimized for individual contributor engineering roles

version: 1

profile:
  title: "Software Developer"
  skills: []                           # Fill in your tech stack
  seniority: "mid"
  location: ""                         # Fill in your region
  remote_only: true
  min_salary_usd_month: null          # Optional hard floor, USD per month (e.g. 6000). Jobs without a published salary are never dropped for this.
  location_allow: []                   # Location terms you can work from, e.g. ["latam", "latin america", "brazil", "worldwide"]
  location_block: []                   # Location terms to reject, e.g. ["united states", "europe", "india"]
  resume_path: ""

language: "en"

keywords:
  en:
    - "Software Engineer"
    - "Backend Developer"
    - "Frontend Developer"
    - "Full Stack Developer"
    - "Staff Engineer"
    - "Senior Developer"
    - "Platform Engineer"
    - "DevOps Engineer"
    - "Site Reliability Engineer"

  exclude: []                          # Title terms to drop even if a keyword matches, e.g. ["frontend", "mobile", "qa"]

sources:
  greenhouse: true
  lever: true
  ashby: true
  remoteok: true
  getonboard: true
  himalayas: true
  workingnomads: true
  weworkremotely: true
  linkedin:
    enabled: false

watchlist: []

# --- Scoring ---
# The scorer judges each opportunity on these criteria and returns a verdict:
#   APPLY    - meets the hard requirements (location, compensation, role) with no blocker
#   EVALUATE - promising but something is unknown (e.g. salary not published)
#   SKIP     - a hard requirement fails
scoring:
  criteria:
    - "Tech stack fit"
    - "Seniority match"
    - "Company stage fit"
    - "Growth opportunity"

# --- Output ---
# format: artifact | markdown
#   artifact: an interactive tracker page (a Claude artifact) with filters and a status dropdown. Needs the
#             Artifact tools of claude.ai; if they are not available the run falls back to markdown.
#   markdown: a plain tracking file in your working directory (file below).
output:
  format: "artifact"
  artifact_title: "Job Search Tracker"
  file: "opportunities.md"    # used when format is markdown, and as the fallback
