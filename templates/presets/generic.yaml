# Preset: Generic
# Flexible starting point for any professional role

version: 1

profile:
  title: ""                            # Fill in your target role
  skills: []                           # Fill in your key skills
  seniority: "mid"                     # junior | mid | senior | lead | executive
  location: ""                         # Fill in your region
  remote_only: true
  min_salary_usd_month: null          # Optional hard floor, USD per month (e.g. 6000). Jobs without a published salary are never dropped for this.
  location_allow: []                   # Location terms you can work from, e.g. ["latam", "latin america", "brazil", "worldwide"]
  location_block: []                   # Location terms to reject, e.g. ["united states", "europe", "india"]
  resume_path: ""

language: "en"

keywords:
  en: []                               # Fill in job title keywords to search for

  exclude: []                          # Title terms to drop even if a keyword matches, e.g. ["frontend", "mobile", "qa"]

sources:
  greenhouse: true
  lever: true
  ashby: true
  remoteok: true
  getonboard: true
  himalayas: true
  workingnomads: true
  weworkremotely: true
  linkedin:
    enabled: false

watchlist: []

# --- Scoring ---
# The scorer judges each opportunity on these criteria and returns a verdict:
#   APPLY    - meets the hard requirements (location, compensation, role) with no blocker
#   EVALUATE - promising but something is unknown (e.g. salary not published)
#   SKIP     - a hard requirement fails
scoring:
  criteria:
    - "Role fit"
    - "Industry fit"
    - "Company stage fit"
    - "Location fit"

output:
  file: "opportunities.md"
