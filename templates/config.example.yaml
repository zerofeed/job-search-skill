# job-search.yaml — Configuration for the job-search skill
# Copy this file to your working directory as "job-search.yaml" and customize it.
# Or run /job-search without a config file to use the interactive wizard.

version: 1

# --- Your Profile ---
profile:
  title: "Software Engineer"           # Your target role
  skills: ["Python", "JavaScript"]     # Key skills (used for scoring context)
  seniority: "mid"                     # junior | mid | senior | lead | executive
  location: "United States"            # Preferred location or region
  remote_only: true                    # Only show remote positions
  resume_path: ""                      # Optional: path to resume file (PDF, YAML, or MD)

# Output language (en, es, pt, fr, de, etc.)
language: "en"

# --- Search Keywords ---
# Add keywords in any language. The script searches job titles containing these.
keywords:
  en: ["Software Engineer", "Backend Developer", "Full Stack Developer"]
  # es: ["Ingeniero de Software", "Desarrollador Backend"]

# --- Sources ---
sources:
  # Core sources — always active, no credentials needed
  greenhouse: true
  lever: true
  remoteok: true
  getonboard: true
  himalayas: true
  workingnomads: true
  weworkremotely: true

  # LinkedIn — requires browser cookie (optional)
  linkedin:
    enabled: false
    cookie: ""    # Paste your li_at cookie value here (see README for instructions)

# --- Company Watchlist ---
# Direct ATS checks for specific companies you're interested in.
# ATS type must be "greenhouse" or "lever". Slug is the company identifier in the ATS URL.
watchlist:
  # - { company: "Stripe", ats: "greenhouse", slug: "stripe" }
  # - { company: "Figma", ats: "lever", slug: "figma" }

# --- Scoring ---
# Dimensions and weights for evaluating opportunities against your profile.
# These are auto-proposed by the wizard based on your profile — customize as needed.
# Weights are normalized automatically if they don't sum to 100.
scoring:
  dimensions:
    - { name: "Role fit", weight: 30 }
    - { name: "Tech stack fit", weight: 30 }
    - { name: "Company stage fit", weight: 20 }
    - { name: "Location fit", weight: 20 }
  thresholds:
    apply: 70       # >= this score: recommended to APPLY
    evaluate: 50    # >= this score: worth EVALUATING
    # Below evaluate threshold: SKIP

# --- Output ---
output:
  file: "opportunities.md"    # Tracking file in your working directory
