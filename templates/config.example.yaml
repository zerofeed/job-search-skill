# job-search.yaml — Configuration for the job-search skill
# Copy this file to your working directory as "job-search.yaml" and customize it.
# Or run /job-search without a config file to use the interactive wizard.

version: 1

# --- Your Profile ---
profile:
  title: "Software Engineer"           # Your target role
  skills: ["Python", "JavaScript"]     # Key skills (used for scoring context)
  seniority: "mid"                     # junior | mid | senior | lead | executive
  location: "United States"            # Preferred location or region
  remote_only: true                    # Only show remote positions
  min_salary_usd_month: null           # Optional hard floor in USD per month (e.g. 6000). Jobs with no published salary are never dropped for this.
  location_allow: []                   # Location terms you can work from, e.g. ["latam", "latin america", "brazil", "worldwide"]
  location_block: []                   # Location terms to reject, e.g. ["united states", "europe", "india"]
  resume_path: ""                      # Optional: path to resume file (PDF, YAML, or MD)

# Output language (en, es, pt, fr, de, etc.)
language: "en"

# --- Search Keywords ---
# Add keywords in any language. The script matches them against job titles.
keywords:
  en: ["Software Engineer", "Backend Developer", "Full Stack Developer"]
  # es: ["Ingeniero de Software", "Desarrollador Backend"]
  exclude: []                          # Title terms to drop even if a keyword matches, e.g. ["frontend", "mobile", "qa"]

# --- Sources ---
sources:
  # Core sources — always active, no credentials needed
  greenhouse: true
  lever: true
  ashby: true
  remoteok: true
  getonboard: true
  himalayas: true
  workingnomads: true
  weworkremotely: true

  # LinkedIn — read through Claude in Chrome using your own logged-in session (no cookie needed).
  # Requires the Claude in Chrome extension and a LinkedIn account already logged in in that Chrome.
  # See docs/claude-in-chrome-setup.md.
  linkedin:
    enabled: false

# --- Company Watchlist ---
# Direct ATS checks for specific companies you're interested in.
# ATS type must be "greenhouse", "lever" or "ashby". Slug is the company identifier in the ATS URL.
watchlist:
  # - { company: "Stripe", ats: "greenhouse", slug: "stripe" }
  # - { company: "Figma", ats: "lever", slug: "figma" }

# --- Scoring ---
# The scorer judges each opportunity on these criteria and returns a verdict:
#   APPLY    - meets the hard requirements (location, compensation, role) with no blocker
#   EVALUATE - promising but something is unknown (e.g. salary not published)
#   SKIP     - a hard requirement fails
scoring:
  criteria:
    - "Role fit"
    - "Tech stack fit"
    - "Company stage fit"
    - "Location fit"

# --- Output ---
output:
  file: "opportunities.md"    # Tracking file in your working directory
